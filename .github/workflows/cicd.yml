name: Income Model CI/CD

permissions:
  contents: read

concurrency:
  group: income-production-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          required = ("aws_access_key_id", "aws_secret_access_key")
          missing = [key for key in required if not credentials.get(key)]
          if missing:
              raise SystemExit(f"STORAGE_CREDENTIALS is missing: {', '.join(missing)}")

          values = {
              "AWS_ACCESS_KEY_ID": credentials["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": credentials["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": credentials.get("region", "ap-southeast-1"),
          }
          if credentials.get("aws_session_token"):
              values["AWS_SESSION_TOKEN"] = credentials["aws_session_token"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  env_file.write(f"{name}={value}\n")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          echo "Model f1_score=$F1"

      - name: Save release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            models/model.joblib
            outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          threshold = 0.65
          f1 = float(os.environ["MODEL_F1"])
          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < {threshold:.2f}. Deployment blocked."
              )
          print(f"PASSED: f1_score {f1:.4f} >= {threshold:.2f}.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download approved release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate

      - name: Authenticate to Amazon S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          values = {
              "AWS_ACCESS_KEY_ID": credentials["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": credentials["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": credentials.get("region", "ap-southeast-1"),
          }
          if credentials.get("aws_session_token"):
              values["AWS_SESSION_TOKEN"] = credentials["aws_session_token"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  env_file.write(f"{name}={value}\n")
          PYEOF

      - name: Promote approved model on S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          pip install --disable-pip-version-check boto3==1.41.5
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          print(f"Promoted approved model to s3://{bucket}/artifacts/current/")
          PYEOF

      - name: Copy inference service to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py,requirements.txt"
          target: "/home/${{ secrets.SERVER_USER }}/income-api"
          overwrite: true

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME/income-api"
            "$HOME/income-api/.venv/bin/pip" install -r requirements.txt
            sudo systemctl restart income-api
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for API (attempt $attempt/6)..."
              sleep 5
            done
            sudo journalctl -u income-api --no-pager -n 50
            exit 1
